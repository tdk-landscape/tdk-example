<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="220" viewBox="0 0 1600 220" role="img" aria-labelledby="title">
  <title id="title">service.json writes .autogenerated</title>
  <rect width="1600" height="220" fill="#07070b"/>
  <rect x="0.5" y="0.5" width="1599" height="219" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="0.22em" fill="#ececf1" fill-opacity="0.38">
    <text x="64" y="48">SOURCE</text>
    <text x="430" y="48">ENGINE</text>
    <text x="796" y="48">OUTPUT</text>
    <text x="1162" y="48">RULE</text>
  </g>

  <g font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="28" fill="#f7f7f4">
    <text x="64" y="112">service.json</text>
    <text x="430" y="112">tdk up</text>
    <text x="796" y="112">.autogenerated</text>
    <text x="1162" y="112">do not edit</text>
  </g>

  <g font-family="ui-serif, Georgia, serif" font-size="15" fill="#ececf1" fill-opacity="0.42">
    <text x="64" y="154">one manifest / resource</text>
    <text x="430" y="154">Tilt + Starlark</text>
    <text x="796" y="154">Docker, Vite, env, tsconfig</text>
    <text x="1162" y="154">next up overwrites it</text>
  </g>

  <line x1="380" y1="78" x2="380" y2="168" stroke="#ffffff" stroke-opacity="0.08"/>
  <line x1="746" y1="78" x2="746" y2="168" stroke="#ffffff" stroke-opacity="0.08"/>
  <line x1="1112" y1="78" x2="1112" y2="168" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>

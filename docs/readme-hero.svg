<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">TDK Example</title>
  <desc id="desc">Reference Project-Stack-Resource landscape. Two stacks, four resources, generated config per service.</desc>
  <defs>
    <radialGradient id="orbV" cx="82%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#b79aff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#b79aff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#b79aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbM" cx="12%" cy="108%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#6ee7b7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="#07070b"/>
  <rect width="1600" height="560" fill="url(#orbV)"/>
  <rect width="1600" height="560" fill="url(#orbM)"/>
  <rect width="1600" height="560" filter="url(#grain)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="1599" height="559" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="72" y="64" fill="#ececf1" fill-opacity="0.42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="0.42em">TDK LANDSCAPE</text>
  <text x="1528" y="64" text-anchor="end" fill="#ececf1" fill-opacity="0.32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="0.28em">REFERENCE</text>

  <text x="72" y="250" fill="#f7f7f4" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="92" letter-spacing="-0.04em">Example.</text>
  <text x="72" y="310" fill="#ececf1" fill-opacity="0.62" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="26">Manifests in. Generated config out.</text>
  <text x="72" y="348" fill="#ececf1" fill-opacity="0.38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="0.08em">project  /  stack  /  resource  /  .autogenerated</text>

  <g transform="translate(72 430)">
    <rect width="168" height="44" rx="22" fill="#f7f7f4"/>
    <text x="84" y="28" text-anchor="middle" fill="#07070b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">tdk up</text>
    <rect x="184" width="188" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="278" y="28" text-anchor="middle" fill="#f7f7f4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">two stacks</text>
  </g>

  <g transform="translate(980 148)">
    <rect width="548" height="332" rx="28" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="10" y="10" width="528" height="312" rx="20" fill="#0c0c12" stroke="#ffffff" stroke-opacity="0.06"/>

    <text x="36" y="48" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.28em">IDENTITY</text>
    <text x="36" y="86" fill="#f7f7f4" font-family="ui-serif, Georgia, serif" font-size="28">api :4000</text>
    <text x="36" y="122" fill="#ececf1" fill-opacity="0.45" font-family="ui-serif, Georgia, serif" font-size="28">app :3000</text>

    <line x1="36" y1="156" x2="512" y2="156" stroke="url(#hair)"/>

    <text x="36" y="196" fill="#b79aff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.28em">APPOINTMENT</text>
    <text x="36" y="234" fill="#f7f7f4" font-family="ui-serif, Georgia, serif" font-size="28">api :4001</text>
    <text x="36" y="270" fill="#ececf1" fill-opacity="0.45" font-family="ui-serif, Georgia, serif" font-size="28">app :3001</text>
  </g>
</svg>
